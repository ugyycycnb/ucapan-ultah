<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Birthday 🐾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="ic-cat" viewBox="0 0 64 64">
      <path d="M14 20 L20 8 L27 20 Z" fill="var(--caramel)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M50 20 L44 8 L37 20 Z" fill="var(--caramel)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M18 14 L21 12 L23 18 Z" fill="var(--blush)"/>
      <path d="M46 14 L43 12 L41 18 Z" fill="var(--blush)"/>
      <circle cx="32" cy="34" r="20" fill="var(--caramel)" stroke="#fff" stroke-width="2.5"/>
      <ellipse cx="24" cy="32" rx="3.4" ry="4.2" fill="#2c1b3d"/>
      <ellipse cx="40" cy="32" rx="3.4" ry="4.2" fill="#2c1b3d"/>
      <ellipse cx="25" cy="30.4" rx="1" ry="1.3" fill="#fff"/>
      <ellipse cx="41" cy="30.4" rx="1" ry="1.3" fill="#fff"/>
      <path d="M32 38 L29 41 L35 41 Z" fill="var(--blush)"/>
      <path d="M32 41 Q32 44 29 44.5 M32 41 Q32 44 35 44.5" stroke="#2c1b3d" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <path d="M12 30 L2 27 M12 34 L1 34 M12 38 L2 41" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M52 30 L62 27 M52 34 L63 34 M52 38 L62 41" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="ic-cat-mouth" viewBox="0 0 64 64">
      <path d="M14 20 L20 8 L27 20 Z" fill="var(--caramel)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M50 20 L44 8 L37 20 Z" fill="var(--caramel)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="32" cy="34" r="20" fill="var(--caramel)" stroke="#fff" stroke-width="2.5"/>
      <ellipse cx="24" cy="32" rx="3.4" ry="4.6" fill="#2c1b3d"/>
      <ellipse cx="40" cy="32" rx="3.4" ry="4.6" fill="#2c1b3d"/>
      <ellipse cx="32" cy="42" rx="7" ry="6" fill="#5c2c3d"/>
    </symbol>
    <symbol id="ic-paw" viewBox="0 0 64 64">
      <ellipse cx="32" cy="42" rx="16" ry="13" fill="var(--blush)" stroke="#fff" stroke-width="2.5"/>
      <circle cx="14" cy="22" r="7.5" fill="var(--blush)" stroke="#fff" stroke-width="2.5"/>
      <circle cx="32" cy="14" r="8" fill="var(--blush)" stroke="#fff" stroke-width="2.5"/>
      <circle cx="50" cy="22" r="7.5" fill="var(--blush)" stroke="#fff" stroke-width="2.5"/>
    </symbol>
    <symbol id="ic-yarn" viewBox="0 0 64 64">
      <circle cx="32" cy="34" r="22" fill="var(--lavender)" stroke="#fff" stroke-width="2.5"/>
      <path d="M12 24 Q32 34 14 46 M52 24 Q32 34 50 46 M18 14 Q32 34 46 14 M10 34 Q32 26 12 50" stroke="#fff" stroke-width="1.6" fill="none" opacity=".65"/>
      <path d="M40 50 Q52 54 56 44" stroke="var(--lavender)" stroke-width="4" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="ic-heart" viewBox="0 0 64 64">
      <path d="M32 54 C10 40 6 24 18 16 C25 11 32 15 32 22 C32 15 39 11 46 16 C58 24 54 40 32 54 Z" fill="var(--blush)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
      <ellipse cx="24" cy="22" rx="4" ry="2.4" fill="#fff" opacity=".6" transform="rotate(-25 24 22)"/>
    </symbol>
    <symbol id="ic-fish" viewBox="0 0 64 64">
      <path d="M8 32 C18 16 46 16 56 32 C46 48 18 48 8 32 Z" fill="var(--gold)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M56 32 L62 22 L62 42 Z" fill="var(--gold)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="20" cy="29" r="2.2" fill="#2c1b3d"/>
    </symbol>
    <symbol id="ic-spark" viewBox="0 0 64 64">
      <path d="M32 4 C33 20 34 30 60 32 C34 34 33 44 32 60 C31 44 30 34 4 32 C30 30 31 20 32 4 Z" fill="#fff" opacity=".9"/>
    </symbol>
  </defs>
</svg>

<div id="stickers" class="sticker-layer">
  <svg class="sticker st1" data-depth="0.6"><use href="#ic-cat"></use></svg>
  <svg class="sticker st2" data-depth="0.3"><use href="#ic-paw"></use></svg>
  <svg class="sticker st3" data-depth="0.5"><use href="#ic-yarn"></use></svg>
  <svg class="sticker st4" data-depth="0.4"><use href="#ic-heart"></use></svg>
  <svg class="sticker st5" data-depth="0.7"><use href="#ic-fish"></use></svg>
  <svg class="sticker st6" data-depth="0.2"><use href="#ic-spark"></use></svg>
  <svg class="sticker st7" data-depth="0.25"><use href="#ic-spark"></use></svg>
  <svg class="sticker st8" data-depth="0.55"><use href="#ic-paw"></use></svg>
  <div class="gif-sticker gg1" data-depth="0.45"><span class="tape"></span><img id="gif-1" src="assets/cat1.jpg" alt="" onerror="this.closest('.gif-sticker').style.display='none'"></div>
  <div class="gif-sticker gg2" data-depth="0.35"><span class="tape"></span><img id="gif-2" src="assets/cat2.jpg" alt="" onerror="this.closest('.gif-sticker').style.display='none'"></div>
</div>

<div id="hearts-float"></div>
<div id="pawtrail"></div>
<div id="bubbles"></div>
<canvas id="confetti-canvas"></canvas>
<div class="balloons" id="balloons"></div>

<!-- Stage 1 -->
<div class="stage" id="stage-envelope">
  <div class="envelope" id="envelope">
    <div class="env-body"></div>
    <div class="env-label">Untuk <span id="env-name"></span></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="seal"><svg class="seal-paw"><use href="#ic-paw"></use></svg></div>
  </div>
  <p class="tap-text">tap untuk membuka surat</p>
</div>

<!-- Stage 2 -->
<div class="stage hidden" id="stage-letter">
  <div id="letter-paper">
    <svg class="letter-corner"><use href="#ic-cat"></use></svg>
    <p class="salutation">Untuk <span id="letter-name"></span>,</p>
    <p id="letter-text"></p>
    <span class="hint">ketuk untuk lanjut</span>
  </div>
</div>

<!-- Stage 3 -->
<div class="stage hidden" id="stage-cake">

  <div id="feed-game">
    <h2 class="game-title">Kucingnya minta dielus dulu 🐾💗</h2>
    <p class="game-score">❤️ <span id="score-count">0</span> / <span id="score-target">8</span></p>
    <div id="game-area">
      <div id="cat-sprite"><svg id="cat-sprite-svg"><use href="#ic-cat"></use></svg></div>
    </div>
    <div class="love-meter"><div class="love-meter-fill" id="love-fill"></div></div>
    <p class="game-hint">tap-tap kucingnya sampai penuh!</p>
  </div>

  <div id="cake-content" class="hidden">
    <h1 class="bday-title">Happy Birthday, <span id="title-name"></span>!</h1>
    <p class="candle-hint">tiup lilinnya satu-satu ya 🕯️</p>
    <div class="cake-wrap" id="cake-wrap">
      <div class="topper">
        <div class="candle" data-candle="1"><div class="flame"></div><div class="digit" id="age-d1"></div></div>
        <div class="candle" data-candle="2"><div class="flame"></div><div class="digit" id="age-d2"></div></div>
      </div>
      <div class="cake">
        <div class="ear ear-l"></div>
        <div class="ear ear-r"></div>
        <div class="tier top"></div>
        <div class="frosting"></div>
        <div class="tier bottom"></div>
        <svg class="cake-paw p1"><use href="#ic-paw"></use></svg>
        <svg class="cake-paw p2"><use href="#ic-paw"></use></svg>
      </div>
      <div class="plate"></div>
    </div>
    <div class="reveal-box hidden" id="reveal-box">
      <img id="gif-happy" class="happy-gif" src="assets/cat-happy.gif" alt="" onerror="this.style.display='none'">
      <p class="subtitle" id="subtitle-text"></p>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="script.js" defer></script>
</body>
</html>
